<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — CareerNest</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="/" class="brand">CareerNest</a>
      <nav class="nav-links">
        <a href="/register" class="btn">Register</a>
      </nav>
    </header>

    <main class="container">
      <section class="card auth-card">
        <h1>Sign In</h1>
        <p class="subtitle">Access your CareerNest account</p>

        <div id="login-alert" class="alert" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>

          <button type="submit" id="login-submit" class="btn btn-full">Sign In</button>
        </form>

        <p class="footer-text">New to CareerNest? <a href="/register">Create an account</a></p>
      </section>
    </main>

    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
