<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard — CareerNest</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="/" class="brand">
        <img src="/assets/logo.svg" alt="CareerNest Logo" class="brand-logo" />
        <span>CareerNest</span>
      </a>
      <nav class="nav-links" id="nav-actions"></nav>
    </header>

    <main class="container">
      <section class="page-banner">
        <div class="section-header">
          <div>
            <h1>Student Dashboard</h1>
            <p class="subtitle">Signed in as <strong id="student-email"></strong></p>
          </div>
          <div class="nav-links">
            <span class="badge" id="verification-badge">Checking...</span>
            <a href="/jobs" class="btn btn-light btn-sm">Explore Jobs</a>
          </div>
        </div>
      </section>

      <div class="grid-2">
        <section class="card">
          <h2>Academic Profile &amp; CV</h2>
          <div id="profile-alert" class="alert hidden" role="alert"></div>
          <form id="student-profile-form">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" required />
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label for="studentIdNo">University Student ID</label>
                <input type="text" id="studentIdNo" />
              </div>
              <div class="form-group">
                <label for="departmentId">Department</label>
                <select id="departmentId"></select>
              </div>
            </div>
            <div class="grid-2">
              <div class="form-group">
                <label for="cgpa">CGPA (0.00 - 4.00)</label>
                <input type="text" id="cgpa" placeholder="3.75" />
              </div>
              <div class="form-group">
                <label for="graduationYear">Graduation Year</label>
                <input type="text" id="graduationYear" placeholder="2027" />
              </div>
            </div>
            <div class="form-group">
              <label for="skills">Skills (comma separated for skill matching)</label>
              <input type="text" id="skills" placeholder="JavaScript, Node.js, SQL, Figma" />
            </div>
            <div class="form-group">
              <label for="education">Education Summary</label>
              <textarea id="education"></textarea>
            </div>
            <div class="form-group">
              <label for="projects">Key Projects</label>
              <textarea id="projects"></textarea>
            </div>
            <div class="form-group">
              <label for="cvUrl">CV URL (Google Drive / Portfolio https link)</label>
              <input type="url" id="cvUrl" placeholder="https://drive.google.com/..." />
            </div>
            <button type="submit" id="profile-submit" class="btn btn-full">Save Profile</button>
          </form>
        </section>

        <div>
          <section class="card">
            <h2>Notifications</h2>
            <div id="notifications-list"></div>
          </section>

          <section class="card">
            <h2>Bookmarked Jobs</h2>
            <div id="saved-jobs-list"></div>
          </section>
        </div>
      </div>

      <section class="card">
        <h2>My Applications &amp; Live Workflow Stepper</h2>
        <div class="grid-2" id="student-apps-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        © 2026
        <a
          href="https://github.com/mdshabbirhossenbappy"
          target="_blank"
          rel="noopener noreferrer"
          >Md. Shabbir Hossen Bappy</a
        >. All rights reserved.
      </p>
    </footer>

    <script type="module" src="/js/student.js"></script>
  </body>
</html>
